<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cx2c Redirect Network</title>
  <!-- Always pin black before CSS parses — eliminates white flash on any load -->
  <script>document.documentElement.style.backgroundColor = '#000';</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --lime: #39ff14;
      --lime-dim: #1aad00;
      --lime-glow: rgba(57, 255, 20, 0.45);
      --red: #ff2a2a;
      --red-glow: rgba(255, 42, 42, 0.45);
      --black: #000000;
      --grid: rgba(57, 255, 20, 0.06);
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--black);
      color: var(--lime);
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
    }

    /* ─── Animated grid background ─────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridShift 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridShift {
      0%   { background-position: 0 0, 0 0; }
      100% { background-position: 0 40px, 40px 0; }
    }

    /* ─── Scanline overlay ──────────────────────────────────────────────── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 3px,
        rgba(0, 0, 0, 0.18) 3px,
        rgba(0, 0, 0, 0.18) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* ─── Corner brackets ───────────────────────────────────────────────── */
    .bracket {
      position: fixed;
      width: 48px;
      height: 48px;
      z-index: 3;
      opacity: 0.55;
    }
    .bracket::before,
    .bracket::after {
      content: '';
      position: absolute;
      background: var(--lime);
      transition: background 0.6s ease;
    }
    .bracket::before { width: 100%; height: 3px; }
    .bracket::after  { width: 3px;  height: 100%; }

    .bracket.tl { top: 18px; left: 18px; }
    .bracket.tl::before { top: 0; left: 0; }
    .bracket.tl::after  { top: 0; left: 0; }

    .bracket.tr { top: 18px; right: 18px; transform: scaleX(-1); }
    .bracket.tr::before { top: 0; left: 0; }
    .bracket.tr::after  { top: 0; left: 0; }

    .bracket.bl { bottom: 18px; left: 18px; transform: scaleY(-1); }
    .bracket.bl::before { top: 0; left: 0; }
    .bracket.bl::after  { top: 0; left: 0; }

    .bracket.br { bottom: 18px; right: 18px; transform: scale(-1); }
    .bracket.br::before { top: 0; left: 0; }
    .bracket.br::after  { top: 0; left: 0; }

    body.state-error .bracket::before,
    body.state-error .bracket::after {
      background: var(--red);
    }

    /* ─── Container ─────────────────────────────────────────────────────── */
    .container {
      position: relative;
      z-index: 2;
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* ─── Glow ring ─────────────────────────────────────────────────────── */
    .glow-ring {
      position: absolute;
      width: min(400px, 78vw);
      height: min(400px, 78vw);
      border-radius: 50%;
      border: 1px solid var(--lime-glow);
      box-shadow:
        0 0 40px 6px var(--lime-glow),
        inset 0 0 40px 6px rgba(57, 255, 20, 0.06);
      animation: pulse 3.2s ease-in-out infinite;
      transition: border-color 0.6s ease, box-shadow 0.6s ease;
      z-index: 1;
    }

    body.state-error .glow-ring {
      border-color: var(--red-glow);
      box-shadow:
        0 0 40px 6px var(--red-glow),
        inset 0 0 40px 6px rgba(255, 42, 42, 0.06);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50%       { opacity: 0.9; transform: scale(1.04); }
    }

    /* ─── Logo row ──────────────────────────────────────────────────────── */
    .logo-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      z-index: 2;
    }

    .hex-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      color: var(--lime);
      transition: color 0.6s ease;
    }

    body.state-error .hex-icon { color: var(--red); }

    /* ─── Title ─────────────────────────────────────────────────────────── */
    .title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(1.4rem, 4.5vw, 2.8rem);
      letter-spacing: 0.04em;
      text-align: center;
      color: var(--lime);
      text-shadow:
        0 0 8px var(--lime),
        0 0 24px var(--lime-glow),
        0 0 60px rgba(57, 255, 20, 0.2);
      animation: flicker 6s infinite;
      line-height: 1.15;
      transition: color 0.6s ease, text-shadow 0.6s ease;
    }

    body.state-error .title {
      color: var(--red);
      text-shadow:
        0 0 8px var(--red),
        0 0 24px var(--red-glow),
        0 0 60px rgba(255, 42, 42, 0.2);
    }

    @keyframes flicker {
      0%, 92%, 94%, 96%, 100% { opacity: 1; }
      93%                      { opacity: 0.72; }
      95%                      { opacity: 0.88; }
    }

    /* ─── Divider ───────────────────────────────────────────────────────── */
    .divider {
      width: clamp(160px, 40vw, 320px);
      height: 1px;
      margin: 20px 0 18px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--lime-dim) 20%,
        var(--lime) 50%,
        var(--lime-dim) 80%,
        transparent
      );
      box-shadow: 0 0 10px var(--lime-glow);
      transition: background 0.6s ease, box-shadow 0.6s ease;
      z-index: 2;
    }

    body.state-error .divider {
      background: linear-gradient(
        90deg,
        transparent,
        #aa0000 20%,
        var(--red) 50%,
        #aa0000 80%,
        transparent
      );
      box-shadow: 0 0 10px var(--red-glow);
    }

    /* ─── Status label ──────────────────────────────────────────────────── */
    .status-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(0.8rem, 2.6vw, 1.1rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--lime-dim);
      text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
      text-align: center;
      z-index: 2;
      transition: color 0.6s ease, text-shadow 0.6s ease;
      min-height: 1.5em;
    }

    body.state-error .status-label {
      color: #cc2222;
      text-shadow: 0 0 10px rgba(255, 42, 42, 0.3);
    }

    /* ─── Progress bar ──────────────────────────────────────────────────── */
    .progress-wrap {
      margin-top: 24px;
      width: clamp(160px, 50vw, 340px);
      height: 3px;
      background: rgba(57, 255, 20, 0.12);
      border-radius: 2px;
      overflow: hidden;
      z-index: 2;
      transition: background 0.6s ease;
    }

    body.state-error .progress-wrap {
      background: rgba(255, 42, 42, 0.12);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--lime);
      box-shadow: 0 0 8px var(--lime);
      border-radius: 2px;
      transition: background 0.6s ease, box-shadow 0.6s ease, width 0.4s ease;
    }

    body.state-loading .progress-bar {
      animation: scanProgress 1.4s ease-in-out infinite;
    }

    body.state-redirect .progress-bar {
      width: 100%;
      transition: width 0.6s ease;
    }

    body.state-error .progress-bar {
      width: 100%;
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }

    @keyframes scanProgress {
      0%   { width: 0%;  margin-left: 0%; }
      50%  { width: 60%; margin-left: 20%; }
      100% { width: 0%;  margin-left: 100%; }
    }

    /* ─── Terminal log lines ────────────────────────────────────────────── */
    .log-wrap {
      margin-top: 22px;
      width: clamp(220px, 60vw, 420px);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 2;
    }

    .log-line {
      font-size: clamp(0.62rem, 1.8vw, 0.75rem);
      letter-spacing: 0.1em;
      color: rgba(57, 255, 20, 0.35);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.35s ease, transform 0.35s ease, color 0.6s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .log-line.visible {
      opacity: 1;
      transform: translateY(0);
    }

    body.state-error .log-line.ok {
      color: rgba(255, 42, 42, 0.35);
    }

    .log-line.err {
      color: rgba(255, 42, 42, 0.75);
    }

    /* ─── Subtitle (appears on error) ───────────────────────────────────── */
    .subtitle {
      margin-top: 28px;
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(0.85rem, 2.8vw, 1.2rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #cc2222;
      text-shadow: 0 0 10px rgba(255, 42, 42, 0.3);
      text-align: center;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.6s ease 0.3s;
    }

    .subtitle::after {
      content: '_';
      animation: blink 1.1s step-start infinite;
      color: var(--red);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    body.state-error .subtitle {
      opacity: 1;
    }

    /* ─── Bottom status row ─────────────────────────────────────────────── */
    .status-row {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      color: rgba(57, 255, 20, 0.35);
      text-transform: uppercase;
      z-index: 3;
      transition: color 0.6s ease;
      white-space: nowrap;
    }

    body.state-error .status-row {
      color: rgba(255, 42, 42, 0.35);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 8px var(--lime);
      animation: dotPulse 1.8s ease-in-out infinite;
      transition: background 0.6s ease, box-shadow 0.6s ease;
      flex-shrink: 0;
    }

    body.state-error .dot {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
      animation: none;
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* ─── Slug display ──────────────────────────────────────────────────── */
    .slug-display {
      font-size: clamp(0.6rem, 1.6vw, 0.72rem);
      letter-spacing: 0.14em;
      color: rgba(57, 255, 20, 0.22);
      margin-top: 10px;
      z-index: 2;
      transition: color 0.6s ease;
    }

    body.state-error .slug-display {
      color: rgba(255, 42, 42, 0.25);
    }

    /* ─── Black page overlay — used for flash-free navigation ───────────── */
    /*
      Sits above everything. Starts transparent. fadeToHome() transitions it
      to opacity:1 (pure black, no browser canvas visible), THEN navigates.
      This keeps the background fully black during the page transition —
      no html element opacity is ever lowered.
    */
    #page-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      transition: opacity 0.55s ease;
    }

    /* ─── Mobile ────────────────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .bracket { width: 32px; height: 32px; }
      .bracket.tl { top: 12px; left: 12px; }
      .bracket.tr { top: 12px; right: 12px; }
      .bracket.bl { bottom: 12px; left: 12px; }
      .bracket.br { bottom: 12px; right: 12px; }
      .hex-icon { width: 30px; height: 30px; }
    }
  </style>
</head>
<body class="state-loading">

  <!-- Corner brackets -->
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>

  <div class="container">
    <div class="glow-ring"></div>

    <!-- Logo + Title -->
    <div class="logo-row">
      <svg class="hex-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="32,4 58,18 58,46 32,60 6,46 6,18"
                 stroke="currentColor" stroke-width="2.5" fill="none"
                 filter="url(#glow)" />
        <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle"
              font-family="'Orbitron',sans-serif" font-weight="900"
              font-size="18" fill="currentColor">CC</text>
        <defs>
          <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
      </svg>
      <h1 class="title">Cx2c Redirect Network</h1>
    </div>

    <div class="divider"></div>

    <p class="status-label" id="statusLabel">Resolving route...</p>
    <p class="slug-display" id="slugDisplay"></p>

    <!-- Progress bar -->
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Terminal log lines -->
    <div class="log-wrap" id="logWrap">
      <div class="log-line ok" id="log1">&gt; Fetching redirect table...</div>
      <div class="log-line ok" id="log2">&gt; Parsing route map...</div>
      <div class="log-line ok" id="log3">&gt; Matching slug...</div>
      <div class="log-line"   id="log4"></div>
    </div>

    <!-- Subtitle: only visible on error state (matches index.html) -->
    <p class="subtitle" id="subtitle">Try your link again</p>
  </div>

  <!-- Bottom status bar -->
  <div class="status-row">
    <div class="dot"></div>
    <span id="nodeStatus">Routing engine online &nbsp;|&nbsp; Resolving...</span>
  </div>

  <!--
    Black overlay div — starts transparent, fades to opaque before navigation.
    Keeps the canvas black at all times; no html/body opacity is ever touched.
  -->
  <div id="page-overlay"></div>

  <script>
    // ── Helpers ──────────────────────────────────────────────────────────────

    /**
     * Fade the solid black overlay div to fully opaque, store the handoff
     * flag, then navigate to /. The background stays black the entire time —
     * no transparent html element, no white browser canvas.
     */
    function fadeToHome() {
      sessionStorage.setItem('cx2c_from_error', '1');
      var overlay = document.getElementById('page-overlay');
      // Allow pointer events so nothing can be clicked during fade-out
      overlay.style.pointerEvents = 'all';
      // Trigger the CSS transition to black
      overlay.style.opacity = '1';
      setTimeout(function () { window.location.replace('/'); }, 600);
    }

    function showLog(id, text, cls) {
      var el = document.getElementById(id);
      if (!el) return;
      if (text !== undefined) el.textContent = text;
      if (cls) { el.classList.remove('ok'); el.classList.add(cls); }
      setTimeout(function () { el.classList.add('visible'); }, 10);
    }

    function setState(state) {
      document.body.className = 'state-' + state;
    }

    function setStatus(text) {
      document.getElementById('statusLabel').textContent = text;
    }

    function setNodeStatus(text) {
      document.getElementById('nodeStatus').textContent = text;
    }

    // ── Boot ─────────────────────────────────────────────────────────────────

    var path = window.location.pathname.replace(/\/$/, '') || '/';
    document.getElementById('slugDisplay').textContent = 'slug: ' + path;

    // Stagger first three log lines in
    setTimeout(function () { showLog('log1'); },  120);
    setTimeout(function () { showLog('log2'); },  480);
    setTimeout(function () { showLog('log3'); },  820);

    // ── Redirect logic ───────────────────────────────────────────────────────

    fetch('/redirects.json')
      .then(function (r) { return r.json(); })
      .then(function (data) {

        setTimeout(function () {
          if (data[path]) {
            // ✅ Match found — redirect
            setState('redirect');
            setStatus('Route found. Routing...');
            setNodeStatus('Match confirmed | Redirecting');
            showLog('log4', '> Match found \u2192 ' + data[path]);

            setTimeout(function () {
              window.location.replace(data[path]);
            }, 800);

          } else {
            // ❌ No route match — error state then hand off to index
            setState('error');
            setStatus('Routing table unavailable.');
            setNodeStatus('Fetch error\u00a0\u00a0|\u00a0\u00a0Routing engine offline');
            showLog('log4', '> FETCH ERROR: Network request failed.', 'err');

            setTimeout(fadeToHome, 2000);
          }
        }, 600);

      })
      .catch(function (err) {
        // 🔴 Fetch failed — error state then hand off to index
        setState('error');
        setStatus('Routing table unavailable.');
        setNodeStatus('Fetch error\u00a0\u00a0|\u00a0\u00a0Routing engine offline');
        showLog('log4', '> FETCH ERROR: Network request failed.', 'err');

        setTimeout(fadeToHome, 2000);
      });
  </script>
</body>
</html>
