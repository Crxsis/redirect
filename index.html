<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cx2c Redirect Network</title>

  <!--
    SEAMLESS HANDOFF SCRIPT — must run before <style> is parsed.
    Setting data-instant on <html> here means the html[data-instant] CSS
    rules below are TRUE when the browser first builds the CSSOM, so
    animation:none applies at first paint with zero race condition.
  -->
  <script>
    if (sessionStorage.getItem('cx2c_from_error')) {
      document.documentElement.setAttribute('data-instant', '');
      document.documentElement.style.opacity = '0';
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --red: #ff2a2a;
      --red-dim: #aa0000;
      --red-glow: rgba(255, 42, 42, 0.45);
      --black: #000000;
      --grid: rgba(255, 42, 42, 0.05);
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--black);
      color: var(--red);
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
    }

    /* ─── Animated grid background ─────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridShift 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridShift {
      0%   { background-position: 0 0, 0 0; }
      100% { background-position: 0 40px, 40px 0; }
    }

    /* ─── Scanline overlay ──────────────────────────────────────────────── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 3px,
        rgba(0, 0, 0, 0.18) 3px,
        rgba(0, 0, 0, 0.18) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* ─── Corner brackets ───────────────────────────────────────────────── */
    .bracket {
      position: fixed;
      width: 48px;
      height: 48px;
      z-index: 3;
      opacity: 0.65;
    }
    .bracket::before,
    .bracket::after {
      content: '';
      position: absolute;
      background: var(--red);
    }
    .bracket::before { width: 100%; height: 3px; }
    .bracket::after  { width: 3px;  height: 100%; }

    .bracket.tl { top: 18px; left: 18px; }
    .bracket.tl::before { top: 0; left: 0; }
    .bracket.tl::after  { top: 0; left: 0; }

    .bracket.tr { top: 18px; right: 18px; transform: scaleX(-1); }
    .bracket.tr::before { top: 0; left: 0; }
    .bracket.tr::after  { top: 0; left: 0; }

    .bracket.bl { bottom: 18px; left: 18px; transform: scaleY(-1); }
    .bracket.bl::before { top: 0; left: 0; }
    .bracket.bl::after  { top: 0; left: 0; }

    .bracket.br { bottom: 18px; right: 18px; transform: scale(-1); }
    .bracket.br::before { top: 0; left: 0; }
    .bracket.br::after  { top: 0; left: 0; }

    /* ─── Container ─────────────────────────────────────────────────────── */
    .container {
      position: relative;
      z-index: 2;
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* ─── Glow ring ─────────────────────────────────────────────────────── */
    .glow-ring {
      position: absolute;
      width: min(400px, 78vw);
      height: min(400px, 78vw);
      border-radius: 50%;
      border: 1px solid var(--red-glow);
      box-shadow:
        0 0 40px 6px var(--red-glow),
        inset 0 0 40px 6px rgba(255, 42, 42, 0.06);
      animation: pulse 3.2s ease-in-out infinite;
      z-index: 1;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      50%       { opacity: 1;    transform: scale(1.04); }
    }

    /* ─── Logo row ──────────────────────────────────────────────────────── */
    .logo-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      z-index: 2;
    }

    .hex-icon { width: 40px; height: 40px; flex-shrink: 0; }

    /* ─── Title ─────────────────────────────────────────────────────────── */
    .title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(1.4rem, 4.5vw, 2.8rem);
      letter-spacing: 0.04em;
      text-align: center;
      color: var(--red);
      text-shadow:
        0 0 8px var(--red),
        0 0 24px var(--red-glow),
        0 0 60px rgba(255, 42, 42, 0.2);
      animation: flicker 5s infinite;
      line-height: 1.15;
    }

    @keyframes flicker {
      0%, 90%, 92%, 94%, 100% { opacity: 1; }
      91%                      { opacity: 0.65; }
      93%                      { opacity: 0.85; }
    }

    /* ─── Divider ───────────────────────────────────────────────────────── */
    .divider {
      width: clamp(160px, 40vw, 320px);
      height: 1px;
      margin: 20px 0 18px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--red-dim) 20%,
        var(--red) 50%,
        var(--red-dim) 80%,
        transparent
      );
      box-shadow: 0 0 10px var(--red-glow);
      z-index: 2;
    }

    /* ─── Status label ──────────────────────────────────────────────────── */
    .status-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(0.8rem, 2.6vw, 1.1rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #cc2222;
      text-shadow: 0 0 10px rgba(255, 42, 42, 0.3);
      text-align: center;
      z-index: 2;
    }

    /* ─── Progress bar (fully filled, red) ─────────────────────────────── */
    .progress-wrap {
      margin-top: 24px;
      width: clamp(160px, 50vw, 340px);
      height: 3px;
      background: rgba(255, 42, 42, 0.12);
      border-radius: 2px;
      z-index: 2;
    }

    .progress-bar {
      height: 100%;
      width: 100%;
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
      border-radius: 2px;
    }

    /* ─── Terminal log lines ────────────────────────────────────────────── */
    .log-wrap {
      margin-top: 22px;
      width: clamp(220px, 60vw, 420px);
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 2;
    }

    .log-line {
      font-size: clamp(0.62rem, 1.8vw, 0.75rem);
      letter-spacing: 0.1em;
      opacity: 0;
      transform: translateY(4px);
      animation: fadeUp 0.35s ease forwards;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .log-line.ok  { color: rgba(255, 42, 42, 0.35); }
    .log-line.err { color: rgba(255, 42, 42, 0.75); }

    .log-line:nth-child(1) { animation-delay: 0.15s; }
    .log-line:nth-child(2) { animation-delay: 0.45s; }
    .log-line:nth-child(3) { animation-delay: 0.75s; }
    .log-line:nth-child(4) { animation-delay: 1.05s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── Subtitle / CTA ────────────────────────────────────────────────── */
    .subtitle {
      margin-top: 28px;
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(0.85rem, 2.8vw, 1.2rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #cc2222;
      text-shadow: 0 0 10px rgba(255, 42, 42, 0.3);
      text-align: center;
      z-index: 2;
    }

    .subtitle::after {
      content: '_';
      animation: blink 1.1s step-start infinite;
      color: var(--red);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ─── Bottom status row ─────────────────────────────────────────────── */
    .status-row {
      position: fixed;
      bottom: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      color: rgba(255, 42, 42, 0.35);
      text-transform: uppercase;
      z-index: 3;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }

    /* ─── Mobile ────────────────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .bracket { width: 32px; height: 32px; }
      .bracket.tl { top: 12px; left: 12px; }
      .bracket.tr { top: 12px; right: 12px; }
      .bracket.bl { bottom: 12px; left: 12px; }
      .bracket.br { bottom: 12px; right: 12px; }
      .hex-icon { width: 30px; height: 30px; }
    }

    /* ═══════════════════════════════════════════════════════════════════════
       INSTANT MODE — arriving from 404 handoff
       data-instant is set on <html> by the <head> script BEFORE this <style>
       block is parsed, so these rules are true at first paint.
       All animations are killed immediately — no stagger, no flash.
    ═══════════════════════════════════════════════════════════════════════ */
    html[data-instant] *,
    html[data-instant] *::before,
    html[data-instant] *::after {
      animation: none !important;
    }

    /* Log lines start at opacity:0 by default; show them immediately. */
    html[data-instant] .log-line {
      opacity: 1 !important;
      transform: translateY(0) !important;
    }
  </style>
</head>
<body>

  <!-- Corner brackets -->
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>

  <div class="container">
    <div class="glow-ring"></div>

    <!-- Logo + Title -->
    <div class="logo-row">
      <svg class="hex-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="32,4 58,18 58,46 32,60 6,46 6,18"
                 stroke="#ff2a2a" stroke-width="2.5" fill="none"
                 filter="url(#rglow)" />
        <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle"
              font-family="'Orbitron',sans-serif" font-weight="900"
              font-size="18" fill="#ff2a2a">CC</text>
        <defs>
          <filter id="rglow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
      </svg>
      <h1 class="title">Cx2c Redirect Network</h1>
    </div>

    <div class="divider"></div>

    <p class="status-label">Routing table unavailable.</p>

    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>

    <div class="log-wrap">
      <div class="log-line ok">&gt; Fetching redirect table...</div>
      <div class="log-line ok">&gt; Parsing route map...</div>
      <div class="log-line ok">&gt; Matching slug...</div>
      <div class="log-line err">&gt; FETCH ERROR: Network request failed.</div>
    </div>

    <p class="subtitle">Try your link again</p>
  </div>

  <div class="status-row">
    <div class="dot"></div>
    <span>Fetch error &nbsp;|&nbsp; Routing engine offline</span>
  </div>

  <!--
    HANDOFF FADE-IN — runs after DOM is ready.
    Keeps data-instant active during the fade so nothing animates while
    fading in. Removes it after fade completes so the page comes alive.
  -->
  <script>
    (function () {
      if (sessionStorage.getItem('cx2c_from_error')) {
        sessionStorage.removeItem('cx2c_from_error');

        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            // Fade the whole page in — data-instant keeps content frozen
            document.documentElement.style.transition = 'opacity 0.55s ease';
            document.documentElement.style.opacity   = '1';

            // Once fully visible, release animations so the page feels alive
            setTimeout(function () {
              document.documentElement.removeAttribute('data-instant');
              document.documentElement.style.transition = '';
            }, 600);
          });
        });
      }
    })();
  </script>
</body>
</html>
